services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: riwaj_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      # The container reaches the private services by their compose names.
      # These override the host-oriented values in .env.
      DB_HOST: db
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: null
      APP_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set}
      TRUSTED_PROXIES: "*"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BOOKING_LOCK_STORE: redis
    volumes:
      - riwaj_storage:/var/www/storage
      # Separate public media volume; Nginx receives only this subdirectory.
      - riwaj_public_media:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Check the live FastCGI listener, not only whether the config parses.
      test: ["CMD", "php", "-r", "$s=@fsockopen('127.0.0.1',9000); if (!$s) exit(1); fclose($s);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - riwaj

  db:
    image: mysql:8.0
    container_name: riwaj_db
    restart: unless-stopped
    environment:
      # No insecure fallback passwords. Compose refuses to start until the
      # operator supplies strong values in the environment / .env file.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_DATABASE:-riwaj_grand}
      MYSQL_USER: ${DB_USERNAME:-riwaj}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - riwaj_dbdata:/var/lib/mysql
    # Intentionally NOT published to the host. MySQL is reachable only by the
    # app service on the private bridge network. Add a host mapping yourself if
    # you need a one-off local debugging session.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - riwaj

  redis:
    image: redis:alpine
    container_name: riwaj_redis
    restart: unless-stopped
    # Intentionally internal-only; the app reaches Redis over the bridge network.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riwaj

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: riwaj-grand-web:production
    container_name: riwaj_nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      # Nginx can read public uploads only, never private documents or app logs.
      - riwaj_public_media:/var/www/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - riwaj

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: riwaj_uptime_kuma
    restart: unless-stopped
    profiles:
      - monitoring
    # Access through an SSH tunnel; never expose the monitoring console publicly.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - riwaj_uptime_data:/app/data
    networks:
      - riwaj

  caddy:
    image: caddy:2-alpine
    container_name: riwaj_caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - riwaj_caddy_data:/data
      - riwaj_caddy_config:/config
    depends_on:
      nginx:
        condition: service_started
    networks:
      - riwaj

networks:
  riwaj:
    driver: bridge

volumes:
  riwaj_dbdata:
  riwaj_storage:
  riwaj_public_media:
  riwaj_caddy_data:
  riwaj_caddy_config:
  riwaj_uptime_data:
