version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventhub_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    networks:
      - eventhub

  db:
    image: mysql:8.0
    container_name: eventhub_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-eventhub}
      MYSQL_USER: ${DB_USERNAME:-eventhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rootpassword}
    volumes:
      - eventhub_dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - eventhub

  redis:
    image: redis:alpine
    container_name: eventhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - eventhub

  nginx:
    image: nginx:alpine
    container_name: eventhub_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - eventhub

networks:
  eventhub:
    driver: bridge

volumes:
  eventhub_dbdata: