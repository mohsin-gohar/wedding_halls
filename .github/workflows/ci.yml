name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, exif, pcntl, bcmath, gd, zip, pdo_mysql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax lint
        run: |
          find app config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Pint style check
        run: vendor/bin/pint --test

      - name: Composer security audit
        run: composer audit --locked --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: NPM security audit
        run: npm audit --audit-level=high

      - name: Production asset build
        run: npm run build

      - name: Validate production Docker stack
        run: |
          cp .env.production.example .env
          cat >> .env <<'EOF'
          APP_DOMAIN=example.test
          DB_ROOT_PASSWORD=ci-only-root-password
          DB_PASSWORD=ci-only-app-password
          DB_DATABASE=riwaj_grand_ci
          DB_USERNAME=riwaj_ci
          EOF
          docker compose config --quiet
          docker compose config | grep -F "fsockopen('127.0.0.1',9000)"
          docker compose config | grep -F "172.30.0.10"
          bash -n deploy/backup-docker.sh deploy/restore-drill.sh deploy/restore-storage-drill.sh deploy/production-smoke.sh
          docker run --rm -e APP_DOMAIN=example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --add-host app:127.0.0.1 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
          docker build --target app --tag riwaj-grand:ci .
          docker build --target web --tag riwaj-grand-web:ci .

          # Exercise the actual Nginx image: built assets and public uploads
          # must be served, while private paths remain unavailable.
          docker run --rm riwaj-grand-web:ci test -s /var/www/public/build/manifest.json
          mkdir -p "$RUNNER_TEMP/riwaj-public-media"
          printf 'public-media-ok' > "$RUNNER_TEMP/riwaj-public-media/smoke.txt"
          docker run -d --name riwaj-web-smoke --add-host app:127.0.0.1 \
            -p 127.0.0.1:8080:80 \
            -v "$RUNNER_TEMP/riwaj-public-media:/var/www/storage/app/public:ro" \
            riwaj-grand-web:ci
          trap 'docker rm -f riwaj-web-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/build/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/build/manifest.json >/dev/null; then
            docker exec riwaj-web-smoke ls -la /var/www/public /var/www/public/build || true
            docker logs riwaj-web-smoke || true
            exit 1
          fi
          if ! media_response="$(curl -fsS http://127.0.0.1:8080/storage/smoke.txt)"; then
            docker exec riwaj-web-smoke ls -la /var/www/storage/app/public || true
            docker logs riwaj-web-smoke || true
            exit 1
          fi
          test "$media_response" = "public-media-ok"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/storage/app/private/secret.txt)" = "404"

  test:
    name: MySQL test suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: riwaj_grand_test
          MYSQL_USER: riwaj
          MYSQL_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, exif, pcntl, bcmath, gd, zip, pdo_mysql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies and build
        run: npm ci && npm run build

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "APP_ENV=testing"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=riwaj_grand_test"
            echo "DB_USERNAME=riwaj"
            echo "DB_PASSWORD=rootpassword"
            echo "BROADCAST_CONNECTION=log"
            echo "CACHE_STORE=array"
            echo "BOOKING_LOCK_STORE=array"
            echo "SESSION_DRIVER=array"
            echo "QUEUE_CONNECTION=sync"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
          } >> .env

      - name: Verify MySQL is ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uriwaj -prootpassword --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Run migrations
        run: php artisan migrate --force

      - name: Route integrity
        run: php artisan route:list --except-vendor

      - name: Framework cacheability checks
        run: |
          php artisan config:cache
          php artisan view:cache
          php artisan event:cache
          php artisan optimize:clear

      - name: Run tests
        run: php artisan test

  browser:
    name: Playwright browser QA
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: riwaj_grand_browser
          MYSQL_USER: riwaj
          MYSQL_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, exif, pcntl, bcmath, gd, zip, pdo_mysql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies and build
        run: npm ci && npm run build

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "APP_ENV=local"
            echo "APP_DEBUG=false"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=riwaj_grand_browser"
            echo "DB_USERNAME=riwaj"
            echo "DB_PASSWORD=rootpassword"
            echo "CACHE_STORE=file"
            echo "BOOKING_LOCK_STORE=file"
            echo "SESSION_DRIVER=file"
            echo "QUEUE_CONNECTION=sync"
          } >> .env

      - name: Migrate and seed demo data
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/up > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application... ($i/60)"
            sleep 2
          done
          cat storage/logs/serve.log
          exit 1

      - name: Run Playwright suite
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
          retention-days: 7

  deploy:
    name: deploy (disabled - manual only)
    needs: [quality, test, browser]
    runs-on: ubuntu-latest
    # Production/staging deployment is intentionally disabled: no verified
    # credentials or infrastructure are configured in this repo. Never deploy
    # to production automatically. Enable only with explicit, reviewed config.
    if: false

    steps:
      - name: Deployment intentionally disabled
        run: echo "Automatic deployment is disabled. Configure and run manual deployment only with explicit authorization."
