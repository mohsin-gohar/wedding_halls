<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="4320" height="1360" role="img" aria-label="Riwaj Grand — Riwayat bhi, Jiddat bhi">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.42" r="1.05">
      <stop offset="0" stop-color="#262019"/>
      <stop offset="0.55" stop-color="#14100A"/>
      <stop offset="1" stop-color="#070604"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8A860" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E8A860" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDFAF"/>
      <stop offset="0.28" stop-color="#EDB070"/>
      <stop offset="0.52" stop-color="#C87F3E"/>
      <stop offset="0.78" stop-color="#9E5522"/>
      <stop offset="1" stop-color="#6E3A18"/>
    </linearGradient>
    <linearGradient id="copperTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9C6"/>
      <stop offset="0.35" stop-color="#EFB372"/>
      <stop offset="0.62" stop-color="#C98040"/>
      <stop offset="1" stop-color="#8A4A1E"/>
    </linearGradient>
    <linearGradient id="copperSlogan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A55C"/>
      <stop offset="1" stop-color="#D97F30"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark metallic background -->
  <rect width="1080" height="340" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.045">
    <line x1="0" y1="30"  x2="1080" y2="30"/>
    <line x1="0" y1="62"  x2="1080" y2="62"/>
    <line x1="0" y1="94"  x2="1080" y2="94"/>
    <line x1="0" y1="126" x2="1080" y2="126"/>
    <line x1="0" y1="158" x2="1080" y2="158"/>
    <line x1="0" y1="190" x2="1080" y2="190"/>
    <line x1="0" y1="222" x2="1080" y2="222"/>
    <line x1="0" y1="254" x2="1080" y2="254"/>
    <line x1="0" y1="286" x2="1080" y2="286"/>
    <line x1="0" y1="318" x2="1080" y2="318"/>
  </g>
  <polygon points="0,0 1080,0 1080,64" fill="#FFFFFF" opacity="0.03"/>
  <ellipse cx="172" cy="178" rx="290" ry="215" fill="url(#halo)"/>

  <!-- Icon: Mughal arch dome with RG monogram -->
  <g transform="translate(40,52)" filter="url(#shadow)">
    <!-- Finial: spike + teardrop bud -->
    <path d="M130 0 L130 20" stroke="url(#copper)" stroke-width="5" stroke-linecap="round"/>
    <path d="M130 18 C139 25 140 34 130 41 C120 34 121 25 130 18 Z" fill="url(#copper)"/>
    <!-- Dome outline (scalloped onion arch, flat base) -->
    <path d="M130 46 C122 60 104 72 84 88 C72 99 60 100 52 93 C38 97 26 112 27 130 C27 152 30 172 30 190 L230 190 C230 172 233 152 233 130 C234 112 222 97 208 93 C200 100 188 99 176 88 C156 72 138 60 130 46 Z"
          fill="none" stroke="url(#copper)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Metallic highlight along the top-left of the stroke -->
    <path d="M130 46 C122 60 104 72 84 88 C72 99 60 100 52 93 C38 97 26 112 27 130 C27 152 30 172 30 190 L230 190 C230 172 233 152 233 130 C234 112 222 97 208 93 C200 100 188 99 176 88 C156 72 138 60 130 46 Z"
          fill="none" stroke="#FFE9CC" stroke-width="2.5" opacity="0.5" transform="translate(-2.5,-3)"/>
    <!-- Thin accent base bar -->
    <rect x="52" y="204" width="156" height="6" rx="3" fill="url(#copper)" opacity="0.9"/>
    <!-- RG monogram (3D: dark extrusion behind gradient face) -->
    <g font-family="'Playfair Display','Cinzel',Georgia,'Times New Roman',serif">
      <text x="130" y="170" font-size="86" font-weight="700" text-anchor="middle" letter-spacing="-10" fill="#3F200C" opacity="0.85" transform="translate(2.5,3.5)">RG</text>
      <text x="130" y="170" font-size="86" font-weight="700" text-anchor="middle" letter-spacing="-10" fill="url(#copperTitle)">RG</text>
    </g>
    <!-- Swoosh through the monogram -->
    <path d="M60 180 C82 200 132 204 158 188 C174 178 186 164 191 149" fill="none" stroke="url(#copper)" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Playfair Display','Cinzel',Georgia,'Times New Roman',serif" filter="url(#shadowSm)">
    <text x="371" y="156" font-size="64" font-weight="700" letter-spacing="7" fill="#4A2410" opacity="0.85" transform="translate(2,4)">RIWAJ GRAND</text>
    <text x="368" y="152" font-size="64" font-weight="700" letter-spacing="7" fill="url(#copperTitle)">RIWAJ GRAND</text>
  </g>
  <!-- Slogan -->
  <text x="371" y="198" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="5.5" fill="url(#copperSlogan)">Riwayat bhi, Jiddat bhi</text>
</svg>
