################################################################
# Riwaj Grand — Supervisor: Laravel queue worker
# Place at: /etc/supervisor/conf.d/riwaj-grand-worker.conf
# Then:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start riwaj-grand-worker:*
################################################################

[program:riwaj-grand-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/riwaj-grand/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --backoff=5
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/riwaj-grand/storage/logs/worker.log
stopwaitsecs=3600
