################################################################
# Riwaj Grand — Nginx server block (Laravel 12 + PHP-FPM)
# Place at: /etc/nginx/sites-available/riwaj-grand
# Symlink:  ln -s .../sites-available/riwaj-grand .../sites-enabled/
# Then:     nginx -t && systemctl reload nginx
#
# NOTE: SSL is terminated here by certbot (Let's Encrypt) or Cloudflare.
# Replace YOUR_DOMAIN before enabling this file, then run:
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
################################################################

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Redirect all HTTP -> HTTPS (belt-and-suspenders with FORCE_HTTPS middleware)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ---- SSL (managed by certbot) ----
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/riwaj-grand/public;
    index index.php;

    charset utf-8;

    # ---- Security headers (Laravel middleware also sets these; keep in sync) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WhatsApp webhook verification + payloads (CSRF is excluded in bootstrap/app.php)
    location = /webhooks/whatsapp {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_log  /var/log/nginx/riwaj-grand-error.log;
    access_log /var/log/nginx/riwaj-grand-access.log;
}
