################################################################
# VenueCloud — Supervisor: Laravel queue worker
# Place at: /etc/supervisor/conf.d/venuecloud-worker.conf
# Then:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start venuecloud-worker:*
################################################################

[program:venuecloud-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/venuecloud/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --backoff=5
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/venuecloud/storage/logs/worker.log
stopwaitsecs=3600
